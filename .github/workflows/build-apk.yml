name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Secrets Environment
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          name: JARVIS Android Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🤖 J.A.R.V.I.S Android AI Assistant - APK Release
            
            Installable APK built automatically with GitHub Actions.
            
            #### Features:
            - 🌌 Iron Man Glowing Cyan Arc Reactor HUD
            - 🎙️ Hands-Free "Hey Jarvis" Hindi/English Wake-Word Activation
            - 🗣️ Instant Natural Hindi Male Voice Response ("हाँ सर!")
            - ⚡ Fast Sub-2-Second Voice Responses powered by Google Gemini AI
            - 🎧 Zero Visual Clutter: 100% Pure Voice-Driven UI
